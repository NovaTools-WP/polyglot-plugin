name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          ini-values: error_reporting=E_ALL

      - name: Validate composer.json
        run: composer validate --strict --no-interaction

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP lint
        run: composer lint

      - name: Coding standards (phpcs)
        run: composer phpcs

      - name: Tests (phpunit)
        run: composer test

  js:
    name: JavaScript (vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Tests (vitest)
        run: npm test
